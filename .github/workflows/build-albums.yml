name: Build Album Manifest

on:
  push:
    branches:
      - main
    paths:
      - "Albümler/fotoğraflar/**"
      - "scripts/build-albums.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-albums
  cancel-in-progress: true

jobs:
  build-albums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate album manifest
        run: node scripts/build-albums.js

      - name: Commit updated manifest
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Albümler/albums.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "albums.json is already up to date."
            exit 0
          fi

          git add Albümler/albums.json
          git commit -m "chore: update album manifest"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

