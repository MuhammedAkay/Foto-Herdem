<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#8d5c3b">
  <title>Sayfa Bulunamadı | Foto Herdem</title>
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/favicon/apple-icon-180x180.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="msapplication-config" content="/browserconfig.xml">
  <link rel="icon" type="image/webp" href="/assets/logo.webp">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/404.css">
  <script defer src="js/analytics.js"></script>
</head>

<body class="error-page">

  <div class="flash-overlay" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/" aria-label="Foto Herdem ana sayfa">
        <img class="brand-logo" src="assets/logo.webp" alt="" aria-hidden="true">
        <span>Foto Herdem</span>
      </a>
      <a class="btn btn-secondary error-home-link" href="/">Ana Sayfa</a>
    </div>
  </header>

  <main class="error-stage" aria-labelledby="error-title">

    <div class="error-visual" aria-hidden="true">

      <!-- ===== FOTOĞRAF MAKİNESİ ===== -->
      <div class="camera">
        <!-- Üst: flaş yuvası + viewfinder + mode dial -->
        <div class="cam-top">
          <div class="cam-hotshoe"></div>
          <div class="cam-viewfinder"></div>
          <div class="cam-dial">
            <span class="cam-dial-dot"></span>
          </div>
        </div>

        <!-- Ana gövde -->
        <div class="cam-body">
          <!-- Marka yazısı -->
          <div class="cam-brand">FOTO</div>

          <!-- Küçük detaylar -->
          <div class="cam-led"></div>

          <!-- Tutma yeri (grip) -->
          <div class="cam-grip"></div>

          <!-- Lens barrel (çoklu halka) -->
          <div class="cam-lens-outer">
            <div class="cam-lens-mid">
              <div class="cam-lens-inner">
                <span class="lens-flare"></span>
                <span class="lens-flare-2"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Çıkan fotoğraf -->
      <div class="photo-output">
        <div class="photo-top-bar"></div>
        <span class="photo-code">404</span>
        <span class="photo-text">Bulunamadı</span>
        <div class="photo-bottom-bar"></div>
      </div>

      <!-- Film dekorasyonu -->
      <div class="film-strip">
        <span></span><span></span><span></span>
      </div>

    </div>

    <section class="error-message">
      <span class="error-eyebrow">Bir kare eksik... 📸</span>
      <h1 id="error-title">Sayfa Bulunamadı</h1>
      <p>Aradığınız sayfa taşınmış, silinmiş veya hiç var olmamış olabilir. Merak etmeyin, güzel kareler hâlâ ana sayfada. 😊</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">← Ana Sayfaya Dön</a>
        <a class="btn btn-secondary" href="sayfalar/iletisim.html">İletişime Geç</a>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© 2026 Foto Herdem</div>
      <nav class="footer-links" aria-label="Alt menü">
        <a href="/">Ana Sayfa</a>
        <a href="sayfalar/galeri.html">Galeri</a>
        <a href="sayfalar/iletisim.html">İletişim</a>
      </nav>
    </div>
  </footer>


  <script>
    /* Çekim anında sarsılma + süzülme durdurma */
    setTimeout(function() {
      var cam = document.querySelector('.camera');
      var visual = document.querySelector('.error-visual');
      if (cam) {
        cam.classList.add('shake');
        setTimeout(function() { cam.classList.remove('shake'); }, 400);
      }
      /* Mesajlar gelince süzülme dursun */
      if (visual) {
        visual.style.animation = 'none';
        visual.style.transform = 'translateY(0)';
      }
    }, 2750);
  </script>

  <script src="js/cookie-consent.js"></script>
</body>
</html>
