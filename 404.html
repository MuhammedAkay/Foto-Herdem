<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">

  <meta name="theme-color" content="#8d5c3b">
  <title>Sayfa Bulunamadı | Foto Herdem</title>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/logo-1.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/404.css">
</head>

<body class="error-page">

  <div class="flash-overlay" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="/" aria-label="Foto Herdem ana sayfa">
        <img
          class="brand-logo"
          src="assets/logo-1.png"
          alt=""
          aria-hidden="true"
        >
        <span>Foto Herdem</span>
      </a>

      <a class="btn btn-secondary error-home-link" href="/">
        Ana Sayfa
      </a>
    </div>
  </header>

  <main class="error-stage" aria-labelledby="error-title">

    <div class="error-visual" aria-hidden="true">

      <div class="camera">
        <div class="cam-top"></div>

        <div class="cam-body">
          <div class="cam-details cam-details-left"></div>
          <div class="cam-details cam-details-right"></div>

          <div class="cam-lens">
            <span class="lens-reflection"></span>
          </div>

        </div>
      </div>

      <div class="photo-output">
        <span class="photo-code">404</span>
        <span class="photo-text">Bulunamadı</span>
      </div>

      <div class="film-strip">
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

    <section class="error-message">
      <span class="error-eyebrow">Bir kare eksik... 📸</span>

      <h1 id="error-title">Sayfa Bulunamadı</h1>

      <p>
        Aradığınız sayfa taşınmış, silinmiş veya hiç var olmamış olabilir.
        Merak etmeyin, güzel kareler hâlâ ana sayfada. 😊
      </p>

      <div class="error-actions">
        <a class="btn btn-primary" href="/">
          ← Ana Sayfaya Dön
        </a>

        <a class="btn btn-secondary" href="sayfalar/iletisim.html">
          İletişime Geç
        </a>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© 2026 Foto Herdem</div>

      <nav class="footer-links" aria-label="Alt menü">
        <a href="/">Ana Sayfa</a>
        <a href="sayfalar/galeri.html">Galeri</a>
        <a href="sayfalar/iletisim.html">İletişim</a>
      </nav>
    </div>
  </footer>

</body>
</html>
