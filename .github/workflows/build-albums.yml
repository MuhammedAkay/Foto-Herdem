name: Build Albums Manifest

on:
  push:
    branches: [main]
    paths:
      - "Albümler/fotoğraflar/**"
      - "!Albümler/albums.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build albums manifest
        run: node scripts/build-albums.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Albümler/albums.json"
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "🤖 Albüm manifesti otomatik güncellendi"
            git push
          fi
